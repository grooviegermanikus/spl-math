[package]
name = "spl-math-example"
version = "0.1.0"
description = "Solana Program Library Math Example"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>", "Stefan Oh <grooviegermanikus@gmail.com>"]
repository = "https://github.com/solana-foundation/spl-math"
license = "Apache-2.0"
edition = "2021"
# Test/example program: never goes to crates.io.
publish = false

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
test-sbf = []

# `solana_program::entrypoint!` expands to code gated on `target_os = "solana"`,
# which only the SBF target defines. Declare it so host-target builds don't warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
borsh = "1.5.3"
num-derive = "0.4"
num-traits = "0.2"
solana-program = "3"
# The library this program exercises. Lives in the same repo; see ../README.md.
# Upstream original, for reference:
#   spl-math = { git = "https://github.com/solana-labs/solana-program-library.git", rev = "e00b05c" }
spl-math = { path = ".." }
thiserror = "2.0"

[dev-dependencies]
solana-program-test = "3"
solana-sdk = "3"

[lib]
crate-type = ["cdylib", "lib"]


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
