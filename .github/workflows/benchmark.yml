name: Benchmark

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set env vars
        run: |
          source ci/rust-version.sh
          echo "RUST_STABLE=$rust_stable" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-bench-

      - name: Run benchmarks
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo bench 2>&1 | sed -r 's/\x1b\[[0-9;]*m//g' | tee bench-raw.txt
          # keep only the criterion report: everything from the first "Benchmarking"
          # line onward, minus the transient warm-up/collecting/analyzing progress
          awk '/^Benchmarking /{f=1} f' bench-raw.txt \
            | grep -vE 'Warming up|Collecting|Analyzing' > bench-output.txt || true
          [ -s bench-output.txt ] || cp bench-raw.txt bench-output.txt

      - name: Comment results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- criterion-benchmark -->';
            const raw = fs.readFileSync('bench-output.txt', 'utf8');

            // Parse criterion output into rows of { name, low, median, high }.
            // The name is either inline on the `time:` line (short names) or on a
            // preceding `Benchmarking <name>` line (long names wrap the time value).
            const nameRe = /^Benchmarking\s+(.+?)\s*$/;
            const inlineRe = /^(\S.*?)\s+time:/;
            const timeRe = /time:\s*\[\s*([\d.]+ [^\]\s]+)\s+([\d.]+ [^\]\s]+)\s+([\d.]+ [^\]\s]+)\s*\]/;
            const rows = [];
            let current = null;
            for (const line of raw.split('\n')) {
              const nm = line.match(nameRe);
              if (nm && !/:\s*(Warming up|Collecting|Analyzing)/.test(line)) {
                current = nm[1];
                continue;
              }
              const tm = line.match(timeRe);
              if (tm) {
                const inline = line.match(inlineRe);
                rows.push({ name: inline ? inline[1] : (current || '?'), low: tm[1], median: tm[2], high: tm[3] });
                current = null;
              }
            }

            const table = rows.length
              ? ['| Benchmark | Median | Range |', '|---|--:|--:|']
                  .concat(rows.map((r) => `| \`${r.name}\` | ${r.median} | ${r.low} – ${r.high} |`))
                  .join('\n')
              : '_Could not parse benchmark output; see the full report below._';

            let full = raw.trim();
            const limit = 55000;
            if (full.length > limit) {
              full = full.slice(0, limit) + '\n... truncated, see the workflow logs for the full report ...';
            }

            const body = [
              marker,
              '## Benchmark results',
              '',
              `Criterion benchmarks for \`${context.sha.slice(0, 7)}\` — median wall-clock per iteration. Informational only, not a merge gate.`,
              '',
              table,
              '',
              '<details><summary>Full criterion report</summary>',
              '',
              '```',
              full,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
