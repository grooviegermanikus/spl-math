[package]
name = "spl-math"
version = "0.4.0"
description = "Solana Program Library Math evolved from spl-math"
authors = ["Solana Foundation", "Solana Labs Maintainers <maintainers@solanalabs.com>", "Stefan Oh <grooviegermanikus@gmail.com>"]
repository = "https://github.com/solana-foundation/spl-math"
license = "MIT"
keywords = ["solana", "math", "fixed-point", "arithmetic", "precision"]
edition = "2021"

# `math-example` is deliberately NOT a workspace member. Its solana-program 3.x
# dependency tree requires rustc 1.89, while this crate pins 1.86 to stay
# buildable with agave's toolchain (see rust-toolchain.toml). Excluding it keeps
# the two resolutions -- and the two lockfiles -- independent. It builds from its
# own directory, where its nested rust-toolchain.toml applies.
[workspace]
exclude = ["math-example"]

[features]
default = []

[[bench]]
name = "bench_sqrt"
harness = false

[[bench]]
name = "benches_precision_number"
harness = false

[dependencies]
num-traits = "0.2"
uint = "0.10"

[dev-dependencies]
proptest = { version = "1.8", features = ["timeout"] }
quickcheck = "1"
quickcheck_macros = "1"
libm = "0.2.11"
criterion = "0.8.2"
itertools = "0.15"
bigdecimal-rs = "0.2.1"
fixed = "1.29"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
